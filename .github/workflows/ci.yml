name: CI

# Linux proves the macOS patches left upstream's behaviour alone and runs the
# round-trip golden test. macOS runners use ten times the free minutes, so the
# macOS build runs only when asked: Actions > CI > Run workflow > macOS. Test it
# locally with bin/build-macos and bin/test.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # upstream-sync.yml dispatches this for its PRs
    inputs:
      macos:
        description: Also build and test HypeX.app on macOS
        type: boolean
        default: false

jobs:
  macos:
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install requirements
        run: brew bundle --file=Brewfile
      - name: Build HypeX.app
        run: bin/build-macos
      - name: Unit and GUI tests
        run: HYPE_GUI_TESTS=1 bin/test
      - name: Command-line tests
        run: python3 -m unittest tests.test_cli tests.test_shutdown tests.test_export
      - name: Check the fixtures
        run: |
          for deck in examples/welcome.md tests/fixtures/roundtrip/*/presentation.md; do
            build-macos/HypeX.app/Contents/MacOS/HypeX check "$deck"
          done

  linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install requirements
        run: |
          pacman -Syu --noconfirm --needed base-devel git python \
            qt6-base qt6-declarative qt6-multimedia qt6-imageformats qt6-svg qt6-webengine \
            ffmpeg source-highlight zlib libwebp ttf-jetbrains-mono ttf-jetbrains-mono-nerd
      - uses: actions/checkout@v5
      - name: Build
        run: bin/build
      - name: Unit tests
        run: bin/test
      - name: Command-line and PowerPoint tests
        run: python -m unittest tests.test_cli tests.test_shutdown tests.test_export
